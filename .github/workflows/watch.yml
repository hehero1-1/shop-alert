name: 새 상품 알림

on:
  schedule:
    - cron: "7-59/10 * * * *"   # 10분마다 (정각은 GitHub 가 붐벼서 피함)
  workflow_dispatch:                      # Actions 탭의 Run workflow 버튼으로 바로 실행

permissions:
  contents: write                         # seen.json, watchlist.toml 을 저장하려면 필요

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 새 항목 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: 확인 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json watchlist.toml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "확인 기록 갱신"
          git pull --rebase
          git push
